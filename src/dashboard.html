<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brigitte live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Thème choisi par l'utilisateur, appliqué avant le rendu pour éviter un flash ; clair par défaut.
  try { if (localStorage.getItem("theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
</script>
<style>
  :root {
    --bg:#ffffff; --panel:#ffffff; --soft:#f8fafd; --chip:#eff2f5; --line:#eff2f5; --line2:#e3e7ee; --text:#0d1421; --muted:#58667e; --dim:#a6b0c3;
    --blue:#3861fb; --green:#16c784; --red:#ea3943; --yellow:#f0b90b; --orange:#f68819; --violet:#8b5cf6; --pink:#e84393; --steel:#7a869a;
    --shadow:0 1px 2px rgba(88,102,126,.10), 0 4px 24px rgba(88,102,126,.08); --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme:light;
  }
  :root[data-theme="dark"] {
    --bg:#0d1421; --panel:#171924; --soft:#1a1d29; --chip:#222531; --line:#222531; --line2:#323546; --text:#ffffff; --muted:#a1a7bb; --dim:#616e85;
    --shadow:none; color-scheme:dark;
  }
  * { box-sizing:border-box; }
  body { margin:0; padding-bottom:44px; background:var(--bg); color:var(--text); font:14px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color:inherit; text-decoration:none; }
  a:hover { color:var(--blue); }
  button { font:inherit; color:inherit; cursor:pointer; }
  .num { font-variant-numeric:tabular-nums; }
  .pos { color:var(--green); } .neg { color:var(--red); } .warn { color:var(--orange); } .muted { color:var(--muted); } .dim { color:var(--dim); }
  .wrap { max-width:1440px; margin:0 auto; padding:0 24px; }
  @media (max-width:640px) { .wrap { padding:0 16px; } }

  /* Barre du haut */
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line); }
  header .wrap { height:64px; display:flex; align-items:center; gap:20px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:20px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; }
  .logo { width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--blue); color:#fff; font-size:15px; font-weight:800; }
  .brand small { font-size:12px; font-weight:500; color:var(--muted); letter-spacing:0; }
  .search { margin-left:auto; position:relative; }
  .search input { width:260px; height:36px; padding:0 36px 0 12px; border:0; border-radius:8px; background:var(--chip); color:var(--text); font:inherit; font-size:13px; outline:none; }
  .search input:focus { box-shadow:0 0 0 2px var(--blue); }
  .search kbd { position:absolute; right:8px; top:8px; padding:0 6px; border-radius:4px; background:var(--dim); color:#fff; font:600 12px/20px Inter, sans-serif; }
  .pill { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:8px; font-size:13px; font-weight:600; white-space:nowrap; }
  .pill.paper { background:color-mix(in srgb, var(--blue) 12%, transparent); color:var(--blue); }
  .pill.live { background:var(--red); color:#fff; }
  .icon-btn { width:36px; height:36px; border:0; border-radius:8px; background:var(--chip); display:grid; place-items:center; font-size:16px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--dim); display:inline-block; flex:none; }
  .dot.ok { background:var(--green); } .dot.slow { background:var(--yellow); } .dot.down { background:var(--red); }
  @media (max-width:900px) { .brand small, .search kbd { display:none; } .search input { width:160px; } }
  @media (max-width:560px) { .search { display:none; } .pill.paper, .pill.live { margin-left:auto; } }

  /* Onglets */
  .tabs { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); }
  .tabs button { flex:none; border:0; background:none; padding:16px 16px 13px; font-size:18px; font-weight:500; color:var(--muted); border-bottom:3px solid transparent; }
  .tabs button:hover { color:var(--text); }
  .tabs button.on { color:var(--text); font-weight:700; border-bottom-color:var(--blue); }
  @media (max-width:640px) { .tabs button { font-size:15px; padding:12px 10px 10px; } }
  [data-view]:not(.show) { display:none !important; }

  main { padding-top:16px; padding-bottom:24px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:16px; min-width:0; }
  .card > h2 { margin:0 0 12px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card > h2::after { content:"›"; color:var(--muted); font-weight:500; order:1; }
  .card > h2 .hint { order:2; margin-left:auto; color:var(--muted); font-size:12px; font-weight:500; }
  .card > h2 .filters { order:2; margin-left:auto; }

  /* Rangée de widgets */
  .widgets { display:grid; gap:16px; grid-template-columns:repeat(4, minmax(0, 1fr)); }
  @media (max-width:1250px) { .widgets { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width:700px) { .widgets { grid-template-columns:minmax(0, 1fr); } }
  .tile { border:1px solid var(--line2); border-radius:12px; padding:10px 12px; min-width:0; }
  .tile .label { font-size:12px; color:var(--muted); font-weight:500; }
  .tile .value { font-size:16px; font-weight:700; margin-top:2px; white-space:nowrap; }
  .tile .value small { font-size:12px; font-weight:600; margin-left:4px; }
  .perf { display:grid; gap:8px; grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .perf .gauge-tile { grid-row:span 2; display:flex; flex-direction:column; }
  .gauge { position:relative; width:120px; margin:auto auto 0; }
  .gauge svg { width:120px; height:70px; display:block; }
  .gauge .g-val { position:absolute; left:0; right:0; top:28px; text-align:center; font-size:20px; font-weight:800; }
  .gauge .g-lab { display:block; width:max-content; margin:2px auto 0; padding:0 8px; border-radius:6px; font-size:11px; font-weight:600; color:#fff; }
  .slider { position:relative; height:6px; border-radius:3px; background:var(--chip); margin-top:8px; }
  .slider i { position:absolute; inset:0 auto 0 0; border-radius:3px; background:var(--blue); }
  .rank { display:grid; gap:2px; }
  .rank a, .rank .row { display:grid; grid-template-columns:18px 24px minmax(0, 1fr) auto; gap:8px; align-items:center; padding:7px 4px; border-radius:8px; }
  .rank a:hover { background:var(--soft); color:inherit; }
  .rank .i { color:var(--muted); font-size:13px; }
  .rank .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rank .rt { text-align:right; font-size:13px; font-weight:600; }
  .rank .rt small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .bars { width:100%; height:64px; display:block; margin-top:8px; }
  .act-head { display:flex; gap:20px; flex-wrap:wrap; }
  .act-grid { display:grid; gap:8px; grid-template-columns:repeat(2, minmax(0, 1fr)); margin-top:8px; }
  .pbar { height:4px; border-radius:2px; background:var(--chip); margin-top:5px; overflow:hidden; }
  .pbar i { display:block; height:100%; border-radius:2px; }
  .ico { width:24px; height:24px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:700; color:#fff; flex:none; }
  .off { opacity:.45; }

  /* Pastilles des motifs de rejet */
  .chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:16px 0 4px; }
  .chips button { flex:none; display:inline-flex; align-items:center; gap:8px; height:34px; padding:0 12px 0 6px; border:1px solid var(--line2); border-radius:999px; background:var(--panel); font-size:13px; font-weight:500; }
  .chips button:hover { border-color:var(--blue); }
  .chips .badge { padding:1px 8px; border-radius:999px; color:#fff; font-size:11px; font-weight:700; }
  .chips .lead { padding-left:12px; color:var(--muted); border-style:dashed; }

  /* Barre d'outils du tableau */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 0; }
  .seg { height:32px; padding:0 12px; border:0; border-radius:8px; background:none; color:var(--text); font-size:13px; font-weight:500; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .seg:hover { background:var(--soft); }
  .seg.on { background:color-mix(in srgb, var(--blue) 10%, transparent); color:var(--blue); font-weight:600; }
  .toolbar .right { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  .toolbar .right .seg { background:var(--chip); font-weight:600; }
  .toolbar .right .seg.on { background:var(--blue); color:#fff; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:50%; flex:none; }

  /* Tableaux */
  .tablewrap { overflow-x:auto; }
  .scroll { max-height:460px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; font-weight:700; padding:12px 10px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); white-space:nowrap; background:var(--panel); position:sticky; top:0; z-index:1; }
  td { padding:14px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody tr:hover td { background:var(--soft); }
  .r { text-align:right; }
  .c-rank { width:36px; color:var(--muted); text-align:center; }
  .usd { display:block; color:var(--muted); font-size:12px; }
  .tok { display:inline-flex; align-items:center; gap:10px; max-width:320px; }
  .tok .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; }
  .tok .sym { color:var(--muted); margin-left:6px; font-weight:500; }
  .tok .mint { display:block; color:var(--dim); font-size:11px; font-family:var(--mono); }
  .tag { display:inline-block; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:600; max-width:260px; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
  .chip { display:inline-flex; align-items:center; gap:6px; }
  .empty { padding:32px 0; text-align:center; color:var(--muted); }
  .chg::before { font-size:10px; margin-right:3px; }
  .chg.pos::before { content:"▲"; } .chg.neg::before { content:"▼"; }

  /* Vues secondaires */
  .grid2 { display:grid; gap:16px; grid-template-columns:minmax(0, 2fr) minmax(0, 1fr); align-items:start; }
  .stackv { display:grid; gap:16px; }
  @media (max-width:1000px) { .grid2 { grid-template-columns:minmax(0, 1fr); } }
  .kpis { display:grid; gap:16px; grid-template-columns:repeat(4, minmax(0, 1fr)); }
  @media (max-width:900px) { .kpis { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  .kpis .tile { background:var(--panel); }
  .kpis .value { font-size:22px; }
  .stack { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--chip); margin-bottom:12px; }
  .stack i { display:block; height:100%; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; margin-bottom:16px; font-size:13px; color:var(--muted); }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .legend b { color:var(--text); }
  .reasons { display:grid; }
  .reason { display:grid; grid-template-columns:minmax(0, 1fr) 60px; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .reason:last-child { border-bottom:0; }
  .reason .t { font-weight:600; display:flex; align-items:center; gap:8px; }
  .reason .why { color:var(--muted); font-size:13px; margin-top:2px; }
  .reason .n { text-align:right; font-weight:700; }
  .reason .pbar { margin-top:8px; }
  .rules { display:grid; }
  .rules div { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--muted); }
  .rules div:last-child { border-bottom:0; }
  .rules b { color:var(--text); }
  .term { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:12px 14px; max-height:620px; overflow:auto; }
  .term pre { margin:0; white-space:pre-wrap; word-break:break-word; font:12px/1.7 var(--mono); color:var(--muted); }
  .report { max-height:none; font-size:14px; line-height:1.7; }
  .report h3 { font-size:17px; margin:24px 0 8px; padding-top:16px; border-top:1px solid var(--line); }
  .report h3:first-child { margin-top:0; padding-top:0; border:0; }
  .report h4 { font-size:14px; margin:16px 0 6px; color:var(--blue); }
  .report p, .report ul { margin:6px 0; }
  .report ul { padding-left:20px; }
  .report code { background:var(--chip); padding:1px 5px; border-radius:4px; font-size:12.5px; }

  /* Barre d'état en bas */
  footer { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--panel); border-top:1px solid var(--line); }
  footer .wrap { height:36px; display:flex; align-items:center; gap:18px; overflow-x:auto; scrollbar-width:none; font-size:12px; color:var(--muted); white-space:nowrap; }
  footer b { color:var(--blue); font-weight:600; }
  footer span { display:inline-flex; align-items:center; gap:6px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><span class="logo" aria-hidden="true">B</span>Brigitte <small>bot memecoins Solana</small></div>
    <label class="search"><input id="q" type="search" placeholder="Rechercher un token, un mint…" aria-label="Rechercher un token" autocomplete="off"><kbd>/</kbd></label>
    <span id="mode" class="pill">…</span>
    <button class="icon-btn" id="theme" type="button" aria-label="Basculer le thème clair ou sombre">◐</button>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="overview" class="on">Vue d'ensemble</button>
    <button data-tab="trades">Positions et trades</button>
    <button data-tab="why">Pourquoi pas d'achat</button>
    <button data-tab="agents">Analyses des agents</button>
    <button data-tab="logs">Journal</button>
  </nav>
</div>

<main class="wrap">
  <!-- Vue d'ensemble -->
  <div class="widgets" data-view="overview">
    <section class="card">
      <h2>Performance</h2>
      <div class="perf" id="perf"></div>
    </section>
    <section class="card">
      <h2>Positions ouvertes <span class="hint" id="openHint"></span></h2>
      <div class="rank" id="openList"></div>
    </section>
    <section class="card">
      <h2>Activité <span class="hint">dernière heure</span></h2>
      <div id="activity"></div>
    </section>
    <section class="card">
      <h2>Plateformes <span class="hint">dernière heure</span></h2>
      <div class="rank" id="platforms"></div>
    </section>
  </div>

  <div class="chips" id="chips" data-view="overview"></div>

  <div data-view="overview">
    <div class="toolbar">
      <div id="platFilter" style="display:flex;gap:4px;flex-wrap:wrap"></div>
      <div class="right" id="filters">
        <button class="seg on" data-f="all">Tous</button><button class="seg" data-f="buy">Achats</button><button class="seg" data-f="security">Sécurité</button><button class="seg" data-f="market">Marché</button><button class="seg" data-f="error">Erreurs</button>
      </div>
    </div>
    <div class="tablewrap" id="tokens"></div>
  </div>

  <!-- Positions et trades -->
  <div class="stackv" data-view="trades">
    <div class="kpis" id="tradeKpis"></div>
    <section class="card">
      <h2>Positions ouvertes <span class="hint" id="openHint2"></span></h2>
      <div class="tablewrap" id="open"></div>
    </section>
    <section class="card">
      <h2>Historique des trades <span class="hint" id="closedHint"></span></h2>
      <div class="tablewrap scroll" id="closed"></div>
    </section>
  </div>

  <!-- Pourquoi pas d'achat -->
  <div class="grid2" data-view="why">
    <section class="card">
      <h2>Pourquoi Brigitte n'achète pas <span class="hint">dernière heure</span></h2>
      <div id="funnel"></div>
    </section>
    <section class="card">
      <h2>Règles actives</h2>
      <div class="rules" id="rules"></div>
    </section>
  </div>

  <!-- Analyses des agents -->
  <section class="card" data-view="agents">
    <h2>Analyses des agents
      <span class="filters" id="reportTabs"><button class="seg on" data-r="supervision">Superviseur</button><button class="seg" data-r="apprentissage">Apprentissage</button></span>
    </h2>
    <div class="report" id="report"></div>
  </section>

  <!-- Journal -->
  <section class="card" data-view="logs">
    <h2>Journal du bot <span class="hint">300 dernières lignes</span></h2>
    <div class="term"><pre id="logs"></pre></div>
  </section>
</main>

<footer><div class="wrap" id="statusbar"></div></footer>

<script>
// Les noms et symboles de tokens viennent de n'importe qui : tout texte passe par esc().
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
const $ = (id) => document.getElementById(id);
const nf = (n, d) => Number(n).toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt = (n, d = 4) => (n == null ? "—" : nf(n, d));
const signed = (n, d = 4, suffix = "") => n == null ? "—" : `<span class="${n >= 0 ? "pos" : "neg"}">${n >= 0 ? "+" : "−"}${nf(Math.abs(n), d)}${suffix}</span>`;
// Variation façon marché : triangle coloré et valeur absolue.
const chg = (n, d = 2) => n == null ? '<span class="dim">—</span>' : `<span class="chg ${n >= 0 ? "pos" : "neg"}">${nf(Math.abs(n), d)}%</span>`;
const time = (ms) => new Date(ms).toLocaleTimeString("fr-FR");
const ago = (s) => (s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.floor(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.floor((s % 3600) / 60)} min`);
const usd = (n) => n.toLocaleString("fr-FR", { style: "currency", currency: "USD", notation: n >= 10_000 ? "compact" : "standard", maximumFractionDigits: n >= 10_000 ? 1 : 0 });
const link = (mint) => `${mint.endsWith("pump") ? "https://pump.fun/coin/" : "https://solscan.io/token/"}${encodeURIComponent(mint)}`;
const table = (head, rows, empty = "Rien pour l'instant.") => rows.length
  ? `<table><thead><tr>${head.map((h) => `<th class="${h.endsWith(" ") ? "r" : h === "#" ? "c-rank" : ""}">${h.trim()}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table>`
  : `<div class="empty">${empty}</div>`;

// Couleur stable par token (avatar) : dérivée du mint, pas du nom.
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = (mint, symbol) => `<span class="ico" style="background:hsl(${hue(mint)} 60% 50%)">${esc((symbol || "?").slice(0, 2).toUpperCase())}</span>`;
const token = (mint, symbol, name) => `<a class="tok" href="${link(mint)}" target="_blank" rel="noopener noreferrer">${avatar(mint, symbol)}
  <span style="min-width:0"><span class="nm">${esc(name || symbol || mint.slice(0, 6))}</span>${name && symbol ? `<span class="sym">${esc(symbol)}</span>` : ""}<span class="mint">${esc(mint.slice(0, 4))}…${esc(mint.slice(-4))}</span></span></a>`;

const PLATFORMS = {
  "pump.fun": ["var(--green)", "P"], letsbonk: ["var(--orange)", "LB"], raydium: ["var(--violet)", "R"],
  "meteora-dbc": ["var(--pink)", "M"], moonshot: ["var(--yellow)", "MS"],
};
const platColor = (p) => (PLATFORMS[p] ?? ["var(--dim)"])[0];
const platChip = (p) => `<span class="chip"><span class="sw" style="background:${platColor(p)}"></span>${esc(p)}</span>`;

// Catégories de décision : lecture en un coup d'œil de l'entonnoir et du flux.
const CATS = {
  buy: { label: "Achats", color: "var(--green)" },
  pending: { label: "En évaluation", color: "var(--yellow)" },
  security: { label: "Rejet sécurité", color: "var(--orange)" },
  market: { label: "Filtre marché", color: "var(--steel)" },
  error: { label: "Erreurs", color: "var(--red)" },
};
const SECURITY = /authority|extension|programme de token|rugcheck|holder|insider|créateur|liste noire|aller-retour|simulation|honeypot|mayhem/i;
const category = (d = "") => d === "achat" ? "buy" : d === "en évaluation" ? "pending" : /^erreur|trop d'évaluations/.test(d) ? "error" : SECURITY.test(d) ? "security" : "market";
// Motifs techniques du bot traduits en langage clair. Le premier motif qui correspond l'emporte : l'ordre compte.
const EXPLAIN = [
  [/^achat/, "Acheté", () => "Le token a passé tous les contrôles : Brigitte a pris une position."],
  [/^en évaluation/, "En cours d'analyse", (r) => `Brigitte attend ${r.entryDelaySeconds} s pour observer les premiers acheteurs, puis lance les contrôles de sécurité.`],
  [/^dev buy.*</, "Créateur trop peu investi", (r) => `Le créateur a acheté moins de ${r.minDevBuySol} SOL de son propre token au lancement : il n'y croit pas lui-même, c'est souvent un lancement jetable.`],
  [/^dev buy.*>/, "Créateur trop gros acheteur", (r) => `Le créateur a acheté plus de ${r.maxDevBuySol} SOL dès le départ : il détient une grosse part et peut tout revendre d'un coup sur les acheteurs (dump).`],

const explain = (d, r) => {
  const e = EXPLAIN.find(([re]) => re.test(d));
  return e ? { title: e[1], why: e[2](r) } : { title: d, why: "" };
};
const tag = (d) => {
  const c = CATS[category(d)].color, e = explain(d, last.rules);
  return `<span class="tag" title="${esc(`${e.why}\n\nMotif technique : ${d}`)}" style="color:${c};background:color-mix(in srgb, ${c} 14%, transparent)">${esc(e.title)}</span>`;
};

// Jauge demi-cercle en 5 segments (rouge → vert), le point marque la valeur.
function gauge(pct) {
  const colors = ["var(--red)", "var(--orange)", "var(--yellow)", "#93d900", "var(--green)"];
  const pt = (a, r = 48) => [60 - r * Math.cos(a), 60 - r * Math.sin(a)].map((v) => v.toFixed(1)).join(",");
  const arcs = colors.map((c, i) => {
    const a0 = (i / 5) * Math.PI + 0.06, a1 = ((i + 1) / 5) * Math.PI - 0.06;
    return `<path d="M${pt(a0)} A48,48 0 0 1 ${pt(a1)}" stroke="${c}" stroke-width="8" fill="none" stroke-linecap="round"/>`;
  }).join("");
  const dot = pct == null ? "" : `<circle cx="${pt((pct / 100) * Math.PI).split(",")[0]}" cy="${pt((pct / 100) * Math.PI).split(",")[1]}" r="6" fill="var(--panel)" stroke="var(--text)" stroke-width="3"/>`;
  const lab = pct == null ? ["—", "var(--dim)"] : pct < 20 ? ["Très faible", "var(--red)"] : pct < 40 ? ["Faible", "var(--orange)"] : pct < 60 ? ["Moyen", "var(--yellow)"] : pct < 80 ? ["Bon", "#7bc000"] : ["Excellent", "var(--green)"];
  return `<div class="gauge"><svg viewBox="0 0 120 70" aria-hidden="true">${arcs}${dot}</svg><div class="g-val num">${pct == null ? "—" : Math.round(pct)}</div><span class="g-lab" style="background:${lab[1]}">${lab[0]}</span></div>`;
}

let filter = "all", plat = "all", query = "";
let last;

function render(s) {
  const r = s.rules;
  $("mode").className = `pill ${s.mode}`;
  $("mode").textContent = s.mode === "live" ? "● LIVE · argent réel" : "PAPER · simulation";

  const silent = s.tokens.length ? (s.now - s.tokens[0].created_at) / 1000 : Infinity;
  const feed = silent < 60 ? "ok" : silent < 300 ? "slow" : "down";

  // Chiffres de la dernière heure
  const nowMin = Math.floor(s.now / 60000);
  const counts = Array.from({ length: 60 }, (_, i) => s.perMinute.find((p) => p.m === nowMin - 59 + i)?.n ?? 0);
  const seenHour = counts.reduce((a, b) => a + b, 0);
  const last10 = counts.slice(-11, -1).reduce((a, b) => a + b, 0) / 10; // minutes complètes seulement
  const avgHour = seenHour / 60;
  const buys = s.funnel["achat"] ?? 0;
  const trades = s.totals.trades, wins = s.totals.wins ?? 0;
  const winRate = trades ? (wins / trades) * 100 : null;
  const unrealized = s.open.reduce((a, p) => a + (p.value == null ? 0 : p.value - p.cost), 0);
  const solUsdTxt = (v) => (s.solUsd && v != null ? usd(Math.abs(v) * s.solUsd) : "");

  // Widget Performance
  const tile = (label, value, extra = "", cls = "") => `<div class="tile ${cls}"><div class="label">${label}</div><div class="value num">${value}</div>${extra}</div>`;
  $("perf").innerHTML = [
    `<div class="tile gauge-tile"><div class="label">Taux de réussite</div>${gauge(winRate)}</div>`,
    tile("PnL réalisé", `${signed(s.realizedPnl, 3)} <small class="muted">SOL</small>`, `<div class="usd">${solUsdTxt(s.realizedPnl)} · ${trades} trade${trades > 1 ? "s" : ""}</div>`),
    tile("PnL latent", s.open.length ? `${signed(unrealized, 3)} <small class="muted">SOL</small>` : '<span class="dim">—</span>', `<div class="usd">${s.open.length ? solUsdTxt(unrealized) : "aucune position"}</div>`),
    tile("Positions", `${s.open.length}<span class="dim"> / ${r.maxOpenPositions}</span>`, `<div class="slider"><i style="width:${(s.open.length / r.maxOpenPositions) * 100}%"></i></div>`),
    tile("Achats (1 h)", `${buys}<small class="muted">${seenHour ? nf((buys / seenHour) * 100, 1) : "0"} %</small>`, `<div class="usd">${r.buySol} SOL par position</div>`),
  ].join("");

  // Widget Positions ouvertes (classement par PnL)
  $("openHint").textContent = `${s.open.length} / ${r.maxOpenPositions}`;
  const openSorted = [...s.open].map((p) => ({ ...p, pnl: p.value == null ? null : ((p.value - p.cost) / p.cost) * 100 })).sort((a, b) => (b.pnl ?? -1e9) - (a.pnl ?? -1e9));
  $("openList").innerHTML = openSorted.length ? openSorted.map((p, i) =>
    `<a href="${link(p.mint)}" target="_blank" rel="noopener noreferrer"><span class="i">${i + 1}</span>${avatar(p.mint, p.symbol)}<span class="nm">${esc(p.symbol || p.mint.slice(0, 6))}</span><span class="rt num">${chg(p.pnl, 1)}<small>${ago((s.now - p.openedAt) / 1000)} · ${fmt(p.value, 3)} SOL</small></span></a>`).join("")
    : `<div class="empty">Aucune position.<br><span class="dim">Brigitte attend un token qui passe tous les contrôles.</span></div>`;

  // Widget Activité : chiffres clés et barres par minute
  const max = Math.max(1, ...counts), W = 600, H = 64, bw = W / 60;
  const bars = counts.map((n, i) => `<rect x="${(i * bw + 1).toFixed(1)}" y="${(H - Math.max(2, (n / max) * H)).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${Math.max(2, (n / max) * H).toFixed(1)}" rx="1.5" fill="${n === max && n ? "var(--blue)" : "color-mix(in srgb, var(--blue) 45%, transparent)"}"><title>il y a ${59 - i} min · ${n} token${n > 1 ? "s" : ""}</title></rect>`).join("");
  const trend = avgHour ? ((last10 - avgHour) / avgHour) * 100 : null;
  $("activity").innerHTML = `
    <div class="tile"><div class="act-head">
      <div><div class="label">Tokens analysés</div><div class="value num">${seenHour}</div></div>
      <div><div class="label">Achats</div><div class="value num pos">${buys}</div></div>
      <div><div class="label">Pic</div><div class="value num">${max}<small class="muted">/min</small></div></div>
    </div><svg class="bars" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Nouveaux tokens par minute sur 60 minutes">${bars}</svg></div>
    <div class="act-grid">
      ${tile("Rythme (10 min)", `${nf(last10, 1)}<small class="muted">/min</small>`, `<div class="usd">${chg(trend, 0)} vs moyenne 1 h</div>`)}
      ${tile("Dernier token", silent === Infinity ? "—" : `il y a ${ago(silent)}`, `<div class="usd" style="display:flex;align-items:center;gap:6px"><span class="dot ${feed}"></span>${feed === "down" ? "flux silencieux" : feed === "slow" ? "flux ralenti" : "flux actif"}</div>`)}
    </div>`;

  // Widget Plateformes
  const pmax = Math.max(1, ...s.platforms.map((p) => p.seen));
  const known = new Set(s.platforms.map((p) => p.platform));
  const plats = [...s.platforms, ...r.platforms.filter((p) => !known.has(p)).map((p) => ({ platform: p, seen: 0, bought: 0 }))];
  $("platforms").innerHTML = plats.length ? plats.map((p, i) => {
    const [color, abbr] = PLATFORMS[p.platform] ?? ["var(--dim)", "?"];
    const on = r.platforms.includes(p.platform);
    return `<div class="row ${on ? "" : "off"}"><span class="i">${i + 1}</span><span class="ico" style="background:${color}">${abbr}</span>
      <div style="min-width:0"><div class="nm">${esc(p.platform)}${on ? "" : ' <span class="dim" style="font-weight:400">· non suivie</span>'}</div><div class="pbar"><i style="width:${(p.seen / pmax) * 100}%;background:${color}"></i></div></div>
      <span class="rt num">${p.seen}<small>${p.bought ?? 0} achat${(p.bought ?? 0) > 1 ? "s" : ""}</small></span></div>`;
  }).join("") : `<div class="empty">Aucune plateforme active.</div>`;

  // Pastilles : principaux motifs de rejet, un clic ouvre le détail
  const funnel = Object.entries(s.funnel).sort((a, b) => b[1] - a[1]);
  const rejects = funnel.filter(([k]) => !["achat", "en évaluation"].includes(k)).slice(0, 6);
  $("chips").innerHTML = rejects.length ? `<button class="lead" data-go="why">Pourquoi Brigitte n'achète pas ›</button>` + rejects.map(([k, n]) =>
    `<button data-go="why" title="${esc(explain(k, r).why)}"><span class="badge num" style="background:${CATS[category(k)].color}">${n}</span>${esc(explain(k, r).title)}</button>`).join("") : "";

  // Filtre par plateforme
  const platNames = [...new Set([...plats.map((p) => p.platform), ...s.tokens.map((t) => t.platform ?? "pump.fun")])];
  $("platFilter").innerHTML = [`<button class="seg ${plat === "all" ? "on" : ""}" data-p="all">Toutes les plateformes</button>`,
    ...platNames.map((p) => `<button class="seg ${plat === p ? "on" : ""}" data-p="${esc(p)}"><span class="sw" style="background:${platColor(p)}"></span>${esc(p)}</button>`)].join("");

  // Tableau principal : flux live des tokens
  const q = query.trim().toLowerCase();
  const rows = s.tokens.filter((t) => (filter === "all" || category(t.decision ?? "") === filter)
    && (plat === "all" || (t.platform ?? "pump.fun") === plat)
    && (!q || [t.symbol, t.name, t.mint].some((v) => String(v ?? "").toLowerCase().includes(q))));
  const solCell = (v, d) => v == null ? '<span class="dim">—</span>' : `${fmt(v, d)} SOL${s.solUsd ? `<span class="usd">${usd(v * s.solUsd)}</span>` : ""}`;
  $("tokens").innerHTML = table(["#", "Nom", "Plateforme", "Dev buy ", "Cap. marché ", "Décision", "Heure "], rows.map((t, i) =>
    `<tr><td class="c-rank num">${i + 1}</td><td>${token(t.mint, t.symbol, t.name)}</td><td>${platChip(t.platform ?? "pump.fun")}</td><td class="r num">${solCell(t.dev_buy_sol, 2)}</td><td class="r num">${solCell(t.mcap_sol, 1)}</td><td>${tag(t.decision ?? "")}</td><td class="r num muted">${time(t.created_at)}</td></tr>`),
    q ? "Aucun token ne correspond à la recherche." : "Aucun token dans cette catégorie.");

  // Vue Positions et trades
  const pnlSum = s.closed.reduce((a, c) => a + (c.proceeds - c.cost), 0);
  $("tradeKpis").innerHTML = [
    tile("PnL réalisé", `${signed(s.realizedPnl, 4)} <small class="muted">SOL</small>`, `<div class="usd">${solUsdTxt(s.realizedPnl)}</div>`),
    tile("PnL latent", s.open.length ? `${signed(unrealized, 4)} <small class="muted">SOL</small>` : '<span class="dim">—</span>', `<div class="usd">${s.open.length} position${s.open.length > 1 ? "s" : ""} ouverte${s.open.length > 1 ? "s" : ""}</div>`),
    tile("Taux de réussite", winRate == null ? '<span class="dim">—</span>' : `${Math.round(winRate)} %`, `<div class="usd">${wins} gagnant${wins > 1 ? "s" : ""} sur ${trades}</div>`),
    tile("Trades fermés", trades, `<div class="usd">${r.buySol} SOL par position</div>`),
  ].join("");
  $("openHint2").textContent = `${s.open.length} sur ${r.maxOpenPositions}`;
  $("open").innerHTML = table(["#", "Nom", "Mise ", "Valeur ", "PnL % ", "Plus haut ", "Tenue "], openSorted.map((p, i) => {
    const peak = ((p.peak - p.cost) / p.cost) * 100;
    return `<tr><td class="c-rank num">${i + 1}</td><td>${token(p.mint, p.symbol)}</td><td class="r num">${fmt(p.cost)} SOL</td><td class="r num">${fmt(p.value)} SOL${p.value != null && s.solUsd ? `<span class="usd">${usd(p.value * s.solUsd)}</span>` : ""}</td><td class="r num"><b>${chg(p.pnl, 1)}</b></td><td class="r num">${chg(peak, 1)}</td><td class="r num">${ago((s.now - p.openedAt) / 1000)}<span class="usd">sur ${r.maxHoldSeconds} s</span></td></tr>`;
  }), "Aucune position : Brigitte attend un token qui passe tous les contrôles.");
  $("closedHint").innerHTML = s.closed.length ? `${s.closed.length} derniers · ${signed(pnlSum)} SOL` : "";
  $("closed").innerHTML = table(["#", "Nom", "PnL ", "PnL % ", "Durée ", "Sortie", "Fermé "], s.closed.map((c, i) => {
    const pct = ((c.proceeds - c.cost) / c.cost) * 100;
    return `<tr><td class="c-rank num">${i + 1}</td><td>${token(c.mint, c.symbol)}</td><td class="r num">${signed(c.proceeds - c.cost)} SOL</td><td class="r num"><b>${chg(pct, 1)}</b></td><td class="r num">${ago((c.closed_at - c.opened_at) / 1000)}</td><td>${tag(c.exit_reason)}</td><td class="r num muted">${time(c.closed_at)}</td></tr>`;
  }), "Aucun trade fermé pour l'instant.");

  // Vue Pourquoi pas d'achat : barre empilée par catégorie, puis le détail des motifs
  const total = funnel.reduce((a, [, n]) => a + n, 0);
  const byCat = {};
  for (const [k, n] of funnel) byCat[category(k)] = (byCat[category(k)] ?? 0) + n;
  const fmax = Math.max(1, ...funnel.map((f) => f[1]));
  $("funnel").innerHTML = total ? `
    <div class="stack">${Object.keys(CATS).filter((c) => byCat[c]).map((c) => `<i title="${CATS[c].label} : ${byCat[c]}" style="width:${(byCat[c] / total) * 100}%;background:${CATS[c].color}"></i>`).join("")}</div>
    <div class="legend">${Object.keys(CATS).filter((c) => byCat[c]).map((c) => `<span><span class="sw" style="background:${CATS[c].color}"></span>${CATS[c].label} <b class="num">${byCat[c]}</b></span>`).join("")}</div>
    <div class="reasons">${funnel.map(([k, n]) => {
      const e = explain(k, r), c = CATS[category(k)].color;
      return `<div class="reason"><div><div class="t" title="Motif technique : ${esc(k)}"><span class="sw" style="background:${c}"></span>${esc(e.title)}</div>${e.why ? `<div class="why">${esc(e.why)}</div>` : ""}<div class="pbar"><i style="width:${(n / fmax) * 100}%;background:${c}"></i></div></div><div class="n num">${n}<span class="usd">${nf((n / total) * 100, 1)} %</span></div></div>`;
    }).join("")}</div>`
    : `<div class="empty">Aucun token depuis une heure.</div>`;

  const rule = (k, v) => `<div>${k} <b class="num">${v}</b></div>`;
  $("rules").innerHTML = [
    rule("Take profit", `+${r.takeProfitPct} %`), rule("Stop loss", `−${Math.abs(r.stopLossPct)} %`), rule("Trailing", `${r.trailPct} % après +${r.trailArmPct} %`),
    rule("Durée max", `${r.maxHoldSeconds} s`), rule("Mise", `${r.buySol} SOL`), rule("Dev buy", `${r.minDevBuySol} – ${r.maxDevBuySol} SOL`),
    rule("Délai d'entrée", `${r.entryDelaySeconds} s`), rule("Inflow min", `${r.minInflowSol} SOL`), rule("Liquidité min", `${r.minLiquiditySol} SOL`),
    rule("Score RugCheck max", r.maxRugScore), rule("Top 10 holders max", `${r.maxTop10Pct} %`), rule("Aller-retour max", `−${r.maxRoundTripLossPct} %`),
    rule("Telegram obligatoire", r.requireTelegram ? "oui" : "non"), rule("Vérification des positions", `toutes les ${r.pollSeconds} s`),
  ].join("");

  // Journal
  const box = $("logs").parentElement, atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  $("logs").innerHTML = s.logs.map((l) => `<span class="${/\[err\]|Error|erreur/i.test(l) ? "neg" : /\[buy\]/.test(l) ? "pos" : /\[sell\]/.test(l) ? "warn" : ""}">${esc(l)}</span>`).join("\n");
  if (atBottom) box.scrollTop = box.scrollHeight;

  // Barre d'état
  $("statusbar").innerHTML = [
    `<span><span class="dot ${feed}"></span>Flux : <b>${feed === "down" ? "silencieux" : feed === "slow" ? "ralenti" : "actif"}</b></span>`,
    `<span>Tokens (1 h) : <b class="num">${seenHour}</b></span>`,
    `<span>Achats (1 h) : <b class="num">${buys}</b></span>`,
    `<span>Positions : <b class="num">${s.open.length}/${r.maxOpenPositions}</b></span>`,
    `<span>PnL réalisé : ${signed(s.realizedPnl, 3)} SOL</span>`,
    `<span>SOL : <b class="num">${s.solUsd ? usd(s.solUsd) : "—"}</b></span>`,
    `<span>Mode : <b>${s.mode === "live" ? "LIVE" : "PAPER"}</b></span>`,
    `<span>En ligne depuis <b>${ago((s.now - s.startedAt) / 1000)}</b></span>`,
  ].join("");
}

async function refresh() {
  try { last = await (await fetch("api/state")).json(); } catch {
    $("statusbar").innerHTML = `<span><span class="dot down"></span>Bot injoignable</span>`;
    return;
  }
  render(last);
}

// Onglets : la vue active vit dans l'URL (#trades…) pour pouvoir partager un lien.
const VIEWS = ["overview", "trades", "why", "agents", "logs"];
function show(view) {
  if (!VIEWS.includes(view)) view = "overview";
  document.querySelectorAll("[data-view]").forEach((el) => el.classList.toggle("show", el.dataset.view === view));
  $("tabs").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.tab === view));
  if (view === "agents") refreshReports();
}

// Markdown minimal des rapports : titres, listes, gras, code ; tout est échappé d'abord.
const inline = (l) => l.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
function md(text) {
  let html = "", list = false;
  for (const l of esc(text).split("\n")) {
    const item = /^\s*[-*] (.*)/.exec(l);
    if (!item && list) { html += "</ul>"; list = false; }
    if (item) { if (!list) { html += "<ul>"; list = true; } html += `<li>${inline(item[1])}</li>`; }
    else if (/^#{1,2} /.test(l)) html += `<h3>${inline(l.replace(/^#+ /, ""))}</h3>`;
    else if (/^#{3,} /.test(l)) html += `<h4>${inline(l.replace(/^#+ /, ""))}</h4>`;
    else if (l.trim()) html += `<p>${inline(l)}</p>`;
  }
  return html + (list ? "</ul>" : "");
}
let reports = {}, tab = "supervision";
async function refreshReports() {
  try { reports = await (await fetch("api/reports")).json(); } catch { return; }
  $("report").innerHTML = reports[tab] ? md(reports[tab]) : `<div class="empty">Pas encore de rapport.</div>`;
}

  $("reportTabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  refreshReports();
});
